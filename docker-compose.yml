version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: impulweb-app
    restart: unless-stopped
    ports:
      - "80"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
